<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup OpenTuter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 16px rgba(0,0,0,.1); width: 100%; max-width: 440px; }
  h1 { font-size: 1.3rem; margin-bottom: .25rem; }
  p { font-size: .85rem; color: #666; margin-bottom: 1.5rem; }
  label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: .3rem; margin-top: 1rem; }
  select, input { width: 100%; padding: .55rem .75rem; border: 1px solid #d0d0d0; border-radius: 6px; font-size: .9rem; outline: none; }
  select:focus, input:focus { border-color: #4f46e5; }
  .btn { width: 100%; margin-top: 1.5rem; background: #4f46e5; color: #fff; border: none; padding: .6rem; border-radius: 6px; font-size: .95rem; cursor: pointer; }
  .btn:hover { background: #4338ca; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: #d00; font-size: .8rem; margin-top: .75rem; display: none; }
  .success { color: #090; font-size: .8rem; margin-top: .75rem; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Welcome to OpenTuter</h1>
  <p>Configure your AI provider to get started.</p>

  <label for="provider">Provider</label>
  <select id="provider">
    <option value="">-- Select --</option>
    {% for name, url in providers.items() %}
    <option value="{{ name }}">{{ name }}</option>
    {% endfor %}
  </select>

  <label for="base_url">Base URL</label>
  <input id="base_url" type="text" placeholder="https://api.openai.com/v1">

  <label for="api_key">API Key</label>
  <input id="api_key" type="password" placeholder="sk-...">

  <label for="model">Model</label>
  <input id="model" type="text" placeholder="gpt-4o / qwen3.6 / ...">

  <button class="btn" id="save-btn" onclick="save()">Save & Continue</button>
  <div class="error" id="error-msg"></div>
  <div class="success" id="success-msg">Saved! Redirecting...</div>
</div>

<script>
document.getElementById('provider').addEventListener('change', function() {
  const urls = {{ providers | tojson }};
  if (this.value && urls[this.value] !== undefined) {
    document.getElementById('base_url').value = urls[this.value];
  }
});

async function save() {
  const btn = document.getElementById('save-btn');
  const err = document.getElementById('error-msg');
  const suc = document.getElementById('success-msg');
  btn.disabled = true; err.style.display = 'none'; suc.style.display = 'none';

  const data = {
    provider: document.getElementById('provider').value,
    base_url: document.getElementById('base_url').value.trim(),
    api_key: document.getElementById('api_key').value.trim(),
    model: document.getElementById('model').value.trim(),
  };

  if (!data.base_url) { err.textContent = 'Base URL is required'; err.style.display = 'block'; btn.disabled = false; return; }
  if (!data.model) { err.textContent = 'Model is required'; err.style.display = 'block'; btn.disabled = false; return; }

  const r = await fetch('/api/save_config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  const d = await r.json();
  if (d.error) { err.textContent = d.error; err.style.display = 'block'; btn.disabled = false; return; }

  suc.style.display = 'block';
  setTimeout(() => window.location.href = '/', 1000);
}
</script>
</body>
</html>
