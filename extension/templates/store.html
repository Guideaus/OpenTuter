<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Store</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; padding: 2rem; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #222; }
  .card { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .card-body { flex: 1; }
  .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: .25rem; }
  .card-meta { font-size: .8rem; color: #888; margin-bottom: .5rem; }
  .card-desc { font-size: .9rem; color: #555; line-height: 1.4; }
  .btn { background: #4f46e5; color: #fff; border: none; padding: .5rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: .9rem; white-space: nowrap; margin-left: 1rem; text-decoration: none; display: inline-block; }
  .btn:hover { background: #4338ca; }
</style>
</head>
<body>
<div class="container">
  <h1>Available Plugins</h1>
  {% for p in plugins %}
  <div class="card">
    <div class="card-body">
      <div class="card-title">{{ p.title }}</div>
      <div class="card-meta">by {{ p.author }} v{{ p.version }}</div>
      <div class="card-desc">{{ p.description }}</div>
    </div>
    <a class="btn" href="/{{ p.name }}">Open</a>
  </div>
  {% endfor %}
</div>
</body>
</html>
