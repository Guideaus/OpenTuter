<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenTuter Web GUI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; display: flex; height: 100vh; }
  #sidebar { width: 320px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
  #screen-wrapper { flex: 1; padding: 1rem; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #screen-wrapper img { max-width: 100%; max-height: calc(100vh - 2rem); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
  #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
  .msg { padding: .6rem .9rem; border-radius: 8px; max-width: 85%; line-height: 1.4; font-size: .85rem; white-space: pre-wrap; }
  .msg.you { background: #4f46e5; color: #fff; align-self: flex-end; }
  .msg.ai { background: #f0f0f0; color: #333; align-self: flex-start; }
  .msg.err { background: #fee; color: #c00; align-self: flex-start; }
  #input-bar { display: flex; border-top: 1px solid #e0e0e0; padding: .75rem; gap: .5rem; }
  #input-bar input { flex: 1; border: 1px solid #d0d0d0; border-radius: 6px; padding: .5rem .75rem; font-size: .9rem; outline: none; }
  #input-bar input:focus { border-color: #4f46e5; }
  #input-bar button { background: #4f46e5; color: #fff; border: none; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-size: .9rem; }
  #input-bar button:hover { background: #4338ca; }
  #input-bar button:disabled { opacity: .5; cursor: not-allowed; }
  #status { padding: .25rem 1rem; font-size: .8rem; color: #888; }
  .back-link { display: block; padding: .75rem 1rem; color: #4f46e5; text-decoration: none; font-size: .85rem; border-bottom: 1px solid #e0e0e0; }
  .back-link:hover { background: #f8f8ff; }
  .refresh-btn { position: fixed; bottom: 1rem; right: 1rem; background: #4f46e5; color: #fff; border: none; padding: .5rem .8rem; border-radius: 6px; cursor: pointer; font-size: .8rem; z-index: 10; opacity: .7; }
  .refresh-btn:hover { opacity: 1; }
</style>
</head>
<body>
<div id="sidebar">
  <a class="back-link" href="/">← Back to Store</a>
  <div id="chat"></div>
  <div id="status">Ready</div>
  <div id="input-bar">
    <input id="task-input" type="text" placeholder="Type your task..." autofocus>
    <button id="send-btn">Send</button>
  </div>
</div>
<div id="screen-wrapper">
  <img id="screen-img" src="" alt="Screen">
  <button class="refresh-btn" onclick="refreshScreen()">↻</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('task-input');
const sendBtn = document.getElementById('send-btn');
const screenImg = document.getElementById('screen-img');
const statusEl = document.getElementById('status');

async function refreshScreen() {
  const r = await fetch('/api/screenshot');
  const d = await r.json();
  screenImg.src = 'data:image/png;base64,' + d.image;
}

async function sendTask() {
  const task = input.value.trim();
  if (!task) return;
  input.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'Processing...';

  addMsg(task, 'you');
  const r = await fetch('/api/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task})
  });
  const d = await r.json();
  sendBtn.disabled = false;

  if (d.error) {
    addMsg(d.error, 'err');
    statusEl.textContent = 'Error';
    return;
  }

  addMsg(d.reply, 'ai');
  screenImg.src = 'data:image/png;base64,' + d.screenshot;
  statusEl.textContent = d.reply.includes('FINISHED') ? 'Done.' : 'Waiting...';
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') sendTask(); });
sendBtn.addEventListener('click', sendTask);

refreshScreen();
</script>
</body>
</html>
